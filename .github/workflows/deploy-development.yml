name: Deploy to Development (GCP)

on:
  push:
    branches: [ develop, guess_feature, clerk_feature_dev ]
  pull_request:
    branches: [ main ]

env:
  GCP_PROJECT_ID: gcp-discord-receipt-bot
  GCP_ZONE: australia-southeast1-a
  GCP_INSTANCE: discord-bot-server
  DEPLOY_PATH: /opt/discord-bot/app

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          pytest tests/ -v || echo "Tests failed but continuing deployment to dev"

  deploy:
    name: Deploy to Development Environment
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GCP VM (Dev environment)
        run: |
          cat > deploy-dev.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e

          echo "=== Starting deployment to development ==="
          cd /opt/discord-bot/app

          # Fetch latest code from current branch
          BRANCH_NAME="${GITHUB_REF##*/}"
          git fetch origin "$BRANCH_NAME"
          git reset --hard "origin/$BRANCH_NAME"

          # Decode and install Google credentials
          if [ -f /tmp/credentials-dev-base64.txt ]; then
            echo "📦 Installing development Google credentials..."
            mkdir -p /opt/discord-bot/app/credentials
            base64 -d /tmp/credentials-dev-base64.txt > /opt/discord-bot/app/credentials/credentials.development.json
            chmod 600 /opt/discord-bot/app/credentials/credentials.development.json
            rm /tmp/credentials-dev-base64.txt
            echo "✅ Google credentials installed"
          fi

          # Update conda environment
          source /opt/miniconda/etc/profile.d/conda.sh
          conda activate discord_env
          conda env update -f environment.yml --prune --quiet
          pip install -r requirements.txt --quiet

          # Restart dev service
          sudo systemctl restart discord-bot-dev.service

          # Wait and verify
          sleep 5

          if sudo systemctl is-active --quiet discord-bot-dev.service; then
              echo "✅ Development service is running!"
          else
              echo "❌ Development service failed to start!"
              sudo journalctl -u discord-bot-dev.service -n 30 --no-pager
              exit 1
          fi

          echo "=== Development deployment completed! ==="
          DEPLOY_SCRIPT

          # Transfer encoded credentials to server
          echo "${{ secrets.GOOGLE_CREDENTIALS_DEV }}" > /tmp/credentials-dev-base64.txt
          gcloud compute scp /tmp/credentials-dev-base64.txt botuser@${{ env.GCP_INSTANCE }}:/tmp/ \
            --zone=${{ env.GCP_ZONE }} --quiet
          rm /tmp/credentials-dev-base64.txt

          # Transfer and execute deployment script
          gcloud compute scp deploy-dev.sh botuser@${{ env.GCP_INSTANCE }}:/tmp/deploy-dev.sh \
            --zone=${{ env.GCP_ZONE }} --quiet

          gcloud compute ssh botuser@${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --command="GITHUB_REF=${{ github.ref }} bash -c 'chmod +x /tmp/deploy-dev.sh && /tmp/deploy-dev.sh'" \
            --quiet

      - name: Verify deployment
        run: |
          gcloud compute ssh botuser@${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --command="sudo systemctl status discord-bot-dev.service --no-pager" \
            --quiet
