name: Deploy to Development (GCP)

on:
  push:
    branches: [ develop, guess_feature, clerk_feature_dev ]
  pull_request:
    branches: [ main ]

env:
  GCP_PROJECT_ID: gcp-discord-receipt-bot
  GCP_ZONE: australia-southeast1-a
  GCP_INSTANCE: discord-bot-server
  DEPLOY_PATH: /opt/discord-bot

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          pytest tests/ -v || echo "Tests failed but continuing deployment to dev"

  deploy:
    name: Deploy to Development Environment
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to GCP VM (Dev environment)
        run: |
          # Clean up old deployment directory if exists
          gcloud compute ssh ${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --command="sudo rm -rf /tmp/discord-bot-deploy"

          # Copy files to server
          gcloud compute scp --recurse \
            --zone=${{ env.GCP_ZONE }} \
            . ${{ env.GCP_INSTANCE }}:/tmp/discord-bot-deploy

          # Execute deployment script on server
          gcloud compute ssh ${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --command="sudo bash /tmp/discord-bot-deploy/scripts/deploy.sh development"

      - name: Verify deployment
        run: |
          gcloud compute ssh ${{ env.GCP_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --command="sudo systemctl status discord-bot-dev.service"
