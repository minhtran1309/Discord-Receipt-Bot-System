[pytest]
# Pytest configuration for Discord Receipt Bot System

# Add project root to Python path
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    integration: Integration tests that require external services (Google Sheets, Discord API)
    unit: Unit tests that don't require external services
    slow: Tests that take a long time to run
